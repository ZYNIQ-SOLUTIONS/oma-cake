<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FFF8F2">
    <title>404 — Confection Not Found | OMA Cake</title>
    <link rel="icon" type="image/png" href="./assets/oma_cake_logo_transparent_bg.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-bg: #FFF8F2;
            --secondary-bg: #F5EEE6;
            --accent-warm: #E7D6C1;
            --accent-gold: #C5A059;
            --text: #3B2A20;
            --text-muted: #7A6658;
            --font-heading: 'Playfair Display', Georgia, serif;
            --font-body: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text);
            font-family: var(--font-body);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .bg-ambient {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(231, 214, 193, 0.4) 0%, rgba(255, 248, 242, 0) 70%);
            pointer-events: none;
        }

        .error-card {
            position: relative;
            z-index: 2;
            max-width: 580px;
            width: 100%;
            background: rgba(255, 248, 242, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(197, 160, 89, 0.35);
            border-radius: 4px;
            padding: 3.5rem 2.5rem;
            box-shadow: 0 25px 50px rgba(59, 42, 32, 0.08);
        }

        .logo-img {
            height: 90px;
            width: auto;
            margin-bottom: 2rem;
            filter: drop-shadow(0 4px 10px rgba(59, 42, 32, 0.08));
        }

        .error-num {
            font-family: var(--font-heading);
            font-size: clamp(3.5rem, 12vw, 5.5rem);
            color: var(--accent-gold);
            line-height: 1;
            margin-bottom: 0.8rem;
            letter-spacing: 0.05em;
        }

        .error-title {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .divider {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            margin: 0 auto 1.5rem;
        }

        .error-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.95rem 2rem;
            font-size: 0.82rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 2px;
            transition: all 0.3s ease;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-primary {
            background-color: var(--text);
            color: var(--primary-bg);
            border: 1px solid var(--text);
        }

        .btn-primary:hover {
            background-color: #261b14;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 42, 32, 0.2);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text);
            border: 1px solid var(--accent-gold);
        }

        .btn-outline:hover {
            background-color: var(--accent-warm);
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .error-card {
                padding: 2.5rem 1.5rem;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="bg-ambient"></div>
    <div class="error-card">
        <a href="/">
            <img src="./assets/oma_cake_logo_transparent_bg.png" alt="OMA Cake Atelier" class="logo-img">
        </a>
        <div class="error-num">404</div>
        <h1 class="error-title">Recipe Not Found</h1>
        <div class="divider"></div>
        <p class="error-desc">
            The page or confection you are seeking does not exist or has been relocated to another gallery within our atelier.
        </p>
        <div class="btn-group">
            <a href="/" class="btn btn-primary">Return to Atelier</a>
            <a href="https://wa.me/213779811066" target="_blank" rel="noopener" class="btn btn-outline">Inquire on WhatsApp</a>
        </div>
    </div>
</body>
</html>
